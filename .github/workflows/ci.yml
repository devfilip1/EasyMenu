name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore EasyMenu.slnx

      - name: Build
        run: dotnet build EasyMenu.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers (Docker is available on ubuntu-latest runners).
      - name: Test
        run: dotnet test EasyMenu.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # generate:api runs automatically via the pretest/prebuild scripts.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: easymenu
          POSTGRES_USER: easymenu
          POSTGRES_PASSWORD: easymenu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easymenu -d easymenu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      # The API is started by Playwright's webServer and inherits these: the suite creates owners
      # and orders faster than the production-like limits allow (Auth is 10/60 s by default).
      RateLimiting__Auth__PermitLimit: 10000
      RateLimiting__Checkout__PermitLimit: 10000
      RateLimiting__OrderSubscribe__PermitLimit: 10000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The API runs with the "http" launch profile (Development: port 5080, connection string
      # pointing at localhost:5432 and migrations applied on startup).
      - name: Build API
        working-directory: backend
        run: dotnet build src/EasyMenu.Api

      - name: Install
        run: npm ci

      # Types for e2e/support come from the generated client.
      - name: Generate API client
        run: npm run generate:api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the API (dotnet run) and ng serve via webServer.
      - name: E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  frontend-prod-headers:
    name: Frontend prod image (security headers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: easymenu
          POSTGRES_USER: easymenu
          POSTGRES_PASSWORD: easymenu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easymenu -d easymenu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      # The API is started by Playwright's webServer and inherits these: the suite creates owners
      # and orders faster than the production-like limits allow (Auth is 10/60 s by default).
      RateLimiting__Auth__PermitLimit: 10000
      RateLimiting__Checkout__PermitLimit: 10000
      RateLimiting__OrderSubscribe__PermitLimit: 10000
      # Selects the `prod-headers` Playwright project and skips `ng serve` (see playwright.config.ts).
      E2E_PROD_URL: http://localhost:8080
      # Same origin (research R18): the browser only talks to nginx, which proxies /api/, /hubs/
      # and /media/ to the API on the host, so no CORS origin is configured for 8080.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build API
        working-directory: backend
        run: dotnet build src/EasyMenu.Api

      - name: Build production image
        # The API client is generated inside the image from the contract (named build context).
        run: docker build --build-context contracts=../contracts -t easymenu-web .

      # nginx listens on port 80 inside the container and proxies to the API started on the host
      # by Playwright's webServer (bound to 0.0.0.0:5080 in prod-headers mode).
      - name: Run production image
        run: >-
          docker run -d --name easymenu-web -p 8080:80
          --add-host=host.docker.internal:host-gateway
          -e API_UPSTREAM=http://host.docker.internal:5080
          easymenu-web

      - name: Install
        run: npm ci

      - name: Generate API client
        run: npm run generate:api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Security headers
        run: npx playwright test --project=prod-headers

      - name: Container logs
        if: failure()
        run: docker logs easymenu-web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-headers
          path: frontend/playwright-report
